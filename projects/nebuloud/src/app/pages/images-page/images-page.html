@if (artistId() && artistName()) {
  <main class="images-page">
    <a class="images-page__back" [routerLink]="artistService.route()">← {{ artistName() }}</a>
    <header class="images-page__header">
      <div>
        <p class="eyebrow">Фотоархив</p>
        <h1>Фотографии</h1>
        <p>{{ images().length }} галерей {{ artistName() }}</p>
      </div>
    </header>

    @if (images().length) {
      <div class="galleries-grid">
        @for (item of images(); track item.id) {
          <app-gallery-card
            [link]="artistService.route('/images/' + item.id)"
            [name]="item.title"
            [image]="imageUrl(item.id)"
            (click)="onClick(`click_gallery_${item.path.join('/')}_artist_${artistId()}`)"
          ></app-gallery-card>
        }
      </div>
    } @else {
      <p class="images-page__empty">Фотографии пока не добавлены.</p>
    }
  </main>
} @else {
  <main class="images-page images-page--empty">Артист не найден.</main>
}
