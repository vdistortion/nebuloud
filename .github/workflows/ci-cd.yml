name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  DIRECTUS_URL: https://api.nebuloud.zvalentin.com
  SUGGESTION_WEBHOOK_URL: https://api.nebuloud.zvalentin.com/flows/trigger/f1866803-f7b3-4dd1-9d59-bec46289c5e5
  MAIN_DOMAIN: nebuloud.zvalentin.com

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc -p projects/catalog/tsconfig.app.json --noEmit
      - run: npx tsc -p projects/artist/tsconfig.app.json --noEmit
      - run: >-
          npx prettier --check README.md ARCHITECTURE.md angular.json package.json
          compose.production.yaml .github/workflows/ci-cd.yml tsconfig.json
          scripts/build-sites.mjs scripts/serve-artist.mjs
          $(find projects -type f \( -name '*.ts' -o -name '*.html' -o -name '*.scss' -o -name '*.js' -o -name '*.json' \))
      - name: Build production static sites
        run: npm run build
      - name: Upload production static files
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: nebuloud-sites
          path: dist/sites
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}

    steps:
      - uses: actions/checkout@v5
      - name: Download production static files
        uses: actions/download-artifact@v8
        with:
          name: nebuloud-sites
          path: dist/sites
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?GitHub secret VPS_SSH_KEY is required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo 'SSH_HOST_KEY_OPTIONS=' >> "$GITHUB_ENV"
          else
            echo 'VPS_KNOWN_HOSTS is empty; accepting a new SSH host key for this runner.' >&2
            echo 'SSH_HOST_KEY_OPTIONS=-o StrictHostKeyChecking=accept-new' >> "$GITHUB_ENV"
          fi
      - name: Sync source to VPS
        run: |
          set -euo pipefail
          : "${VPS_HOST:?GitHub secret VPS_HOST is required}"
          VPS_USER="${VPS_USER:-root}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_APP_PATH="${VPS_APP_PATH:-/root/nebuloud}"
          ssh -p "$VPS_PORT" ${SSH_HOST_KEY_OPTIONS:-} \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" "test -f '$VPS_APP_PATH/compose.production.yaml'"
          rsync -az \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            -e "ssh -p $VPS_PORT ${SSH_HOST_KEY_OPTIONS:-} -o ServerAliveInterval=30 -o ServerAliveCountMax=20" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_APP_PATH/"
      - name: Build and restart web
        run: |
          set -euo pipefail
          : "${VPS_HOST:?GitHub secret VPS_HOST is required}"
          VPS_USER="${VPS_USER:-root}"
          VPS_PORT="${VPS_PORT:-22}"
          VPS_APP_PATH="${VPS_APP_PATH:-/root/nebuloud}"
          ssh -p "$VPS_PORT" ${SSH_HOST_KEY_OPTIONS:-} \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" "cd '$VPS_APP_PATH' && set -a && . dist/sites/deploy/deploy.env && set +a && docker compose -f compose.production.yaml build web && docker compose -f compose.production.yaml up -d directus web"
          curl --fail --silent --show-error --head "https://nebuloud.zvalentin.com/"
