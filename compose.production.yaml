name: nebuloud

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - nebuloud_postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:latest
    restart: unless-stopped
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: https://api.nebuloud.zvalentin.com
      CORS_ENABLED: 'true'
      CORS_ORIGIN: https://nebuloud.zvalentin.com
      STORAGE_LOCATIONS: garage,local
      STORAGE_GARAGE_DRIVER: s3
      STORAGE_GARAGE_KEY: ${GARAGE_ACCESS_KEY_ID}
      STORAGE_GARAGE_SECRET: ${GARAGE_SECRET_ACCESS_KEY}
      STORAGE_GARAGE_BUCKET: ${GARAGE_BUCKET}
      STORAGE_GARAGE_ENDPOINT: http://garage:3900
      STORAGE_GARAGE_REGION: garage
      STORAGE_GARAGE_FORCE_PATH_STYLE: 'true'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - caddy
      - garage
    volumes:
      - nebuloud_directus_uploads:/directus/uploads
    labels:
      caddy: api.nebuloud.zvalentin.com
      caddy.reverse_proxy: '{{upstreams 8055}}'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DIRECTUS_URL: https://api.nebuloud.zvalentin.com
    restart: unless-stopped
    networks:
      - caddy
    labels:
      caddy: nebuloud.zvalentin.com
      caddy.reverse_proxy: '{{upstreams 80}}'

volumes:
  nebuloud_postgres_data:
  nebuloud_directus_uploads:

networks:
  internal:
  caddy:
    external: true
  garage:
    external: true
